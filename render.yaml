services:
  - type: web
    name: serverfy-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: serverfy
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
